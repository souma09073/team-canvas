<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>マンジャロゲーム プロトタイプ</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #000; font-family: "Segoe UI", "Hiragino Sans", "Meiryo", sans-serif; }
  #hud { position: fixed; inset: 0; pointer-events: none; color: #fff; }

  /* 血糖ゲージ(左上) */
  #glucosePanel { position: absolute; top: 14px; left: 14px; width: 260px; background: rgba(0,0,0,.55); border-radius: 10px; padding: 10px 12px; }
  #glucosePanel .label { font-size: 12px; opacity: .85; }
  #glucoseBarWrap { position: relative; height: 18px; border-radius: 9px; overflow: hidden; margin-top: 4px;
    /* 3色ゾーン: 端=赤 / 中間=黄 / 安定域=緑 (幅はJSで再設定) */
    background: linear-gradient(to right, #d33 0%, #dc3 15%, #dc3 40%, #3c6 40%, #3c6 60%, #dc3 60%, #dc3 85%, #d33 85%);
  }
  #glucoseNeedle { position: absolute; top: -2px; width: 4px; height: 22px; background: #fff; border-radius: 2px; box-shadow: 0 0 4px #000; }
  #glucoseNum { font-size: 20px; font-weight: bold; margin-top: 2px; }
  #speedNum { font-size: 12px; opacity: .8; }

  /* ゾーンゲージ */
  #zonePanel { position: absolute; top: 118px; left: 14px; width: 260px; background: rgba(0,0,0,.55); border-radius: 10px; padding: 8px 12px; }
  #zonePanel .label { font-size: 12px; opacity: .85; }
  #zoneBarWrap { height: 12px; border-radius: 6px; background: #333; overflow: hidden; margin-top: 4px; }
  #zoneBar { height: 100%; width: 0%; background: linear-gradient(to right, #fc0, #f90); }
  #zonePanel.active .label { color: #fc0; font-weight: bold; }

  /* タイム(上中央) */
  #timePanel { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); font-size: 28px; font-weight: bold; text-shadow: 0 0 6px #000; }

  /* マンジャロ(右下)。状態が4つあるので、色・アイコン・ゲージ・動きの4系統で見分けさせる */
  #shotPanel { position: absolute; right: 20px; bottom: 20px; width: 220px; text-align: center;
    background: rgba(0,0,0,.6); border: 3px solid #666; border-radius: 16px; padding: 14px 14px 12px;
    transition: border-color .12s, background .12s; }
  #shotIcon { position: relative; font-size: 62px; line-height: 1.05; transition: transform .1s; }
  #shotTitle { font-size: 17px; font-weight: bold; letter-spacing: .1em; }
  /* textContent に \n で2行入れるので pre-line が要る(無いと1行に繋がる) */
  #shotState { font-size: 13px; margin: 3px 0 8px; min-height: 34px; white-space: pre-line; opacity: .9; }
  #shotBarWrap { height: 9px; border-radius: 5px; background: rgba(255,255,255,.15); overflow: hidden; }
  #shotBar { height: 100%; width: 100%; background: #6f6; }

  /* 使える:緑に呼吸させて「押していい」を主張する */
  #shotPanel.ready { border-color: #6f6; background: rgba(0,55,10,.6); animation: shotBreath 1.6s ease-in-out infinite; }
  @keyframes shotBreath {
    0%,100% { box-shadow: 0 0 0 0 rgba(110,255,110,.5); }
    50%     { box-shadow: 0 0 24px 5px rgba(110,255,110,.5); }
  }

  /* 補充中:灰色に沈めて、ゲージが溜まりきるまで押せないことを示す */
  #shotPanel.cooldown { border-color: #7a7a86; }
  #shotPanel.cooldown #shotIcon { filter: grayscale(1); opacity: .45; }
  #shotPanel.cooldown #shotBar  { background: #8ab4dd; }

  /* 奪われた:揺らして「取り上げられた」感を出す + 注射器に大きな✕ */
  #shotPanel.locked { border-color: #f4a; background: rgba(85,0,40,.65); animation: shotShake .55s ease-in-out infinite; }
  #shotPanel.locked #shotIcon { filter: grayscale(1) brightness(.55); }
  #shotPanel.locked #shotIcon::after {
    content: "✕"; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    font-size: 72px; font-weight: bold; color: #ff3b6b; text-shadow: 0 0 12px #000;
  }
  #shotPanel.locked #shotBar { background: #f4a; }
  @keyframes shotShake {
    0%,100% { transform: translateX(0) rotate(0); }
    20% { transform: translateX(-6px) rotate(-1.6deg); }
    40% { transform: translateX(6px)  rotate(1.6deg); }
    60% { transform: translateX(-4px) rotate(-1deg); }
    80% { transform: translateX(4px)  rotate(1deg); }
  }

  /* 撃った瞬間:白フチ+水色に弾けさせ、アイコンを一気に拡大する */
  #shotPanel.firing { border-color: #fff; background: rgba(0,170,255,.8); box-shadow: 0 0 40px 10px rgba(0,200,255,.6); }
  #shotPanel.firing #shotIcon { transform: scale(1.45) rotate(-12deg); }
  #shotPanel.firing #shotState { opacity: 1; font-weight: bold; font-size: 15px; }
  #shotPanel.firing #shotBar { background: #fff; }

  /* 注射した瞬間の画面フチ(前方の食べ物が消えたことを画面全体で伝える) */
  #shotVignette { position: fixed; inset: 0; box-shadow: inset 0 0 150px 50px rgba(0,200,255,.55);
    opacity: 0; transition: opacity .3s; }
  #shotVignette.on { opacity: 1; transition: opacity .04s; }

  /* 食べた瞬間の演出:画面フチのオレンジ + 主人公の上に飛び出す「+20」 */
  #foodVignette { position: fixed; inset: 0; box-shadow: inset 0 0 120px 40px rgba(255,150,20,.6);
    opacity: 0; }
  #foodPopup { position: fixed; font-size: 40px; font-weight: bold; color: #ffb02e;
    text-shadow: 0 0 6px #000, 0 3px 0 #7a3d00; transform: translate(-50%, -50%);
    pointer-events: none; white-space: nowrap; }
  /* 血糖値の数字も一緒に跳ねさせる(どこが変わったのか目線を誘導する) */
  #glucoseNum { transition: none; transform-origin: left center; }

  /* 主人公の右横に追従するミニ血糖バー(縦向き:下=0 上=100) */
  #miniGauge { position: fixed; width: 14px; height: 150px; border-radius: 7px;
    border: 2px solid rgba(0,0,0,.65); box-shadow: 0 0 6px rgba(0,0,0,.5);
    transform: translate(0, -50%); pointer-events: none; }
  #miniNeedle { position: absolute; left: -3px; width: 20px; height: 4px; background: #fff;
    border-radius: 2px; box-shadow: 0 0 3px #000; }
  #miniGauge.danger { border-color: #f33; animation: blink .4s infinite; }

  /* 高血糖カウントダウン警告(中央上に大きく) */
  #hyperWarn { position: absolute; top: 70px; left: 50%; transform: translateX(-50%);
    font-size: 30px; font-weight: bold; color: #f33; text-shadow: 0 0 8px #000;
    background: rgba(0,0,0,.6); border: 3px solid #f33; border-radius: 12px; padding: 8px 20px;
    animation: blink .4s infinite; white-space: nowrap; }

  /* 危険点滅・ゾーン発動の画面演出 */
  #dangerVignette { position: fixed; inset: 0; box-shadow: inset 0 0 120px 40px rgba(255,0,0,.7); opacity: 0; }
  #dangerVignette.on { animation: blink .5s infinite; }
  @keyframes blink { 0%,100% { opacity: 0; } 50% { opacity: 1; } }
  #zoneVignette { position: fixed; inset: 0; box-shadow: inset 0 0 140px 40px rgba(255,200,0,.55); opacity: 0; transition: opacity .3s; }
  #zoneVignette.on { opacity: 1; }

  /* オーバーレイ(開始・ゲームオーバー・ゴール) */
  .overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
             background: rgba(0,0,0,.65); color: #fff; text-align: center; pointer-events: auto; }
  .overlay h1 { font-size: 34px; margin: 0 0 16px; }
  .overlay p { font-size: 16px; line-height: 1.9; margin: 4px 0; }
  .overlay .big { font-size: 44px; font-weight: bold; color: #fc0; }
  #goalNewRecord { font-size: 26px; font-weight: bold; color: #fc0; margin: 10px 0 4px;
                   text-shadow: 0 0 10px rgba(255,204,0,.8); animation: blink .6s infinite; }
  #goalBest { opacity: .85; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<div id="hud">
  <div id="glucosePanel">
    <div class="label">血糖値</div>
    <div id="glucoseBarWrap"><div id="glucoseNeedle"></div></div>
    <div id="glucoseNum">50</div>
    <div id="speedNum">速度 100%</div>
  </div>
  <div id="zonePanel">
    <div class="label" id="zoneLabel">ゾーンゲージ(ゲージ中央キープで蓄積)</div>
    <div id="zoneBarWrap"><div id="zoneBar"></div></div>
  </div>
  <div id="timePanel">0.00</div>
  <div id="hyperWarn" class="hidden">⚠ 高血糖! あと 3.0 秒</div>
  <div id="miniGauge" class="hidden"><div id="miniNeedle"></div></div>
  <div id="shotPanel" class="ready">
    <div id="shotIcon">💉</div>
    <div id="shotTitle">マンジャロ</div>
    <div id="shotState">スペースで注射</div>
    <div id="shotBarWrap"><div id="shotBar"></div></div>
  </div>
  <div id="dangerVignette"></div>
  <div id="zoneVignette"></div>
  <div id="shotVignette"></div>
  <div id="foodVignette"></div>
  <div id="foodPopup" class="hidden">+20</div>
</div>

<div id="startOverlay" class="overlay">
  <h1>マンジャロゲーム プロトタイプ</h1>
  <p>←→ / A・D:レーン移動  スペース:注射  Z:ゾーン発動  R:リトライ</p>
  <p>速度はゴールに近づくほど勝手に上がっていく。振り落とされるな。</p>
  <p id="ruleHyper"></p>
  <p id="ruleShot"></p>
  <p id="ruleZone"></p>
  <p style="margin-top:20px; font-weight:bold;">クリックまたは Enter でスタート</p>
</div>

<div id="overOverlay" class="overlay hidden">
  <h1 id="overTitle">倒れた!</h1>
  <p id="overReason"></p>
  <p style="margin-top:16px;">R キーで即リトライ(コース頭から)</p>
</div>

<div id="goalOverlay" class="overlay hidden">
  <h1>GOAL!</h1>
  <div class="big" id="goalTime">0.00 秒</div>
  <div id="goalNewRecord" class="hidden">🏆 ハイスコア更新!</div>
  <p id="goalBest"></p>
  <p id="goalStats"></p>
  <p style="margin-top:16px;">R キーでリトライ(さっきより速く!)</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script>
"use strict";

/* ================================================================
   CONFIG — 調整する数値は全部ここ(プロト指示書のたたき台)
   ================================================================ */
const CONFIG = {
  // ▼▼ 血糖の振れ幅を調整したいときは、この4つだけ触れば足りる ▼▼
  //
  //  [1] foodGain / drainPerSec  … メーターの「跳ね」と「忙しさ」を決める
  //        必要ペース = foodGain ÷ drainPerSec 秒に1個。今は 20÷14 = 1.43秒に1個。
  //        ・両方を同じ倍率で上げる → 跳ねが大きくなる(忙しさは変わらない)
  //        ・foodGain だけ上げる    → 食べる価値が上がり、高血糖に振り切りやすくなる
  //        ・drainPerSec だけ上げる → 低血糖で死にやすくなる
  //
  //  [2] drainPerSecHigh … 高血糖から助かるまでの速さ。小さいほど高血糖で死にやすい
  //        血糖100から安全圏(hyperResetBelow)まで = (100 - 65) ÷ drainPerSecHigh 秒。
  //        今は 35÷15 = 2.33秒。これが hyperGraceSec(3秒)を超えると「振り切ったら確定死」になる。
  //        もっと死なせたい → 12 まで下げる(2.9秒。ほぼ確定死になるので注意)
  //        死にすぎる       → 20〜25 に戻す
  //
  //  [3] hyperGraceSec … 高血糖の猶予秒数。上げると一気に易しくなる安全弁
  //
  //  [4] stableMin / stableMax … 緑(=安定域=ゾーンが溜まる範囲)の幅
  //        広げると易しく、狭めると難しくなる。hyperThreshold と hyperResetBelow も
  //        stableMax に合わせて同じ数字にすること(3ヶ所セットで動かす)
  //
  //  変えたらブラウザを再読み込みするだけで反映される。
  // ▲▲───────────────────────────────────────────────▲▲
  drainPerSec       : 14,     // 血糖の毎秒自然減少・通常時(7→14 取らないとすぐ下がるように)
  drainPerSecHigh   : 15,     // 高血糖時の下がり方(25→15 減少させて高血糖で倒れやすく)
                              //   100→65 が 1.4秒→2.33秒。猶予3秒に対して余裕0.67秒しかない
  stableMin         : 35,     // 安定域 下限(40→35)
  stableMax         : 65,     // 安定域 上限(60→65)
  hyperThreshold    : 65,     // この血糖を超えると高血糖カウントダウン開始(安定域を出たら即危険)
  hyperGraceSec     : 3,      // 猶予(秒)。まだ死にすぎるならここを4に上げるのが一番安全
  hyperResetBelow   : 65,     // カウントダウン解除ライン(安定域に戻ればセーフ)
  foodGain          : 20,     // 食べ物1つの血糖上昇(12→20 取ったことがハッキリ分かる跳ね方に)
  foodBoostMult     : 2.2,    // 食べた瞬間の速度ブースト倍率(1.4→2.2 取る価値を大きくする)
  foodBoostDuration : 0.35,   // 食べた瞬間ブーストの持続(秒)(1.5→0.35 一瞬だけドンと出る)
  shotClearSec      : 2.5,    // 注射:前方「走行速度×この秒数」の食べ物を全レーンまとめて消去
                              //       距離固定だと序盤(速度50)と終盤(速度120)で効果が別物になるため時間で持つ
  shotCooldown      : 7,      // 注射クールタイム(秒)
  lockDuration      : 7,      // 女性接触時の注射ロック(秒)
  zoneChargePerSec  : 20,     // 緑帯 滞在中のゲージ蓄積(%/秒)(8→20 満タンまで12.5秒→5秒。回数上限なし)
  zoneDecayPerSec   : 0,      // 帯を外れた時の減少(%/秒)。0=貯金は消えない
  zoneDuration      : 1.5,    // ゾーン発動時間(秒)
  zoneSpeedMult     : 1.8,    // ゾーン中の速度倍率(その時点の走行速度に対する倍率)
  courseLengthSec   : 70,     // コース1本の想定プレイ時間(45→70 大幅延長)

  // ---- 以下はプロト実装用の追加定数 ----
  baseSpeed         : 70,     // 序盤の基準速度(units/秒)(50→70)
  rampEndMult       : 2.8,    // ゴール直前の速度倍率(2.4→2.8 終速は196units/秒)
  rampCurve         : 1.0,    // 加速カーブ(1=序盤から終盤まで一定ペースで加速)
  zoneBandMin       : 35,     // ゾーンが溜まる血糖の下限 = stableMin と一致(緑=ゾーン範囲に統一)
  zoneBandMax       : 65,     // ゾーンが溜まる血糖の上限 = stableMax と一致
  laneWidth         : 4,      // レーン幅
  laneChangeSpeed   : 18,     // レーン移動の速さ(14→18 最高速120に操作の応答を追従させる)
  dangerZone        : 15,     // 血糖がこの値未満で赤点滅
  collectDist       : 2.0,    // 食べ物・障害物の当たり判定(前後方向)
  // ---- 食べ物の配置(1列は最大2個。3個並べて回避不能にすることはしない) ----
  sparseGapMin      : 52,     // まばら区間の食べ物間隔・最小(32→52 速度が1.6倍になった分だけ広げた)
  sparseGapMax      : 85,     // まばら区間の食べ物間隔・最大(52→85 同上)
  denseRowSpacing   : 50,     // 誘惑バースト(中盤)の列の間隔(30→50)
  finalRowSpacing   : 65,     // 最終ガントレットの列の間隔(40→65)
                              //   レーン移動には 4÷18 = 0.22秒かかる。終盤の速度196では0.22秒=43units
                              //   なので、これより狭いと空きレーンに追いつけず理不尽になる
  denseWeaveChance  : 0.7,    // 密集区間で空きレーンが隣に移動する確率(高いほど左右に振られる)
  denseMaxSameLane  : 2,      // 空きレーンが同じ位置に留まれる最大列数。超えたら強制的に動かす
                              //   (1レーンだけ延々ガラ空きになるのを防ぐ)
  courseStartClear  : 40,     // スタート直後、食べ物を置かない距離
  courseEndClear    : 40,     // ゴール直前、食べ物を置かない距離
  denseEdgeBuffer   : 10,     // 密集区間の前後に空ける距離(まばらの食べ物が混ざらないように)
  womanLeadDist     : 18,     // 女性を密集区間の何units手前に置くか
  // ---- 女性キャラの出現 ----
  womanRevealSec    : 1.2,    // 地面から現れる距離を「走行速度×この秒数」で決める(0.6→1.2 急すぎたので倍に)
  womanRiseSec      : 0.15,   // 地面からせり上がりきるまでの時間(秒)
  seed              : 12345,  // コース生成シード(同じ数字なら毎回同じコース=タイムアタック用)
};

/* ================================================================
   コース生成(シード固定 → リトライしても同じ配置)
   ================================================================ */
function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

// 加速するので、想定プレイ時間×平均速度でコース長を決める
const COURSE_LENGTH = CONFIG.baseSpeed * CONFIG.courseLengthSec * (1 + CONFIG.rampEndMult) / 2;

// 密集区間の位置。コース長に対する割合(0〜1)で指定する。
// 行を足せば3ヶ所目・4ヶ所目が作れる。rowSpacing は小さいほど密。
const DENSE_ZONES = [
  { from: 0.40, to: 0.47, rowSpacing: CONFIG.denseRowSpacing },  // 中盤:誘惑バースト
  { from: 0.84, to: 0.96, rowSpacing: CONFIG.finalRowSpacing },  // 終盤:最終ガントレット
];

// レイアウト定義: まばら区間と密集区間
// 【原則】1列に置くのは最大2個。3個並べて回避不能な壁を作ることはしない。
function buildLayout() {
  const rng = mulberry32(CONFIG.seed);
  const foods = [];   // {z, lane}
  const women = [];   // {z, lane}

  const denseZones = DENSE_ZONES.map(d => ({
    start: COURSE_LENGTH * d.from,
    end:   COURSE_LENGTH * d.to,
    rowSpacing: d.rowSpacing,
  }));

  // まばら区間: sparseGapMin〜Max間隔で1個ずつ。
  // 直前と同じレーンは選ばない(同じレーンに置き続けると、走る側は動かずに拾えてしまい
  // 「レーンを選ぶ」という判断が消える)。
  let z = CONFIG.courseStartClear;
  let lastLane = -1;
  while (z < COURSE_LENGTH - CONFIG.courseEndClear) {
    const inDense = denseZones.some(d =>
      z >= d.start - CONFIG.denseEdgeBuffer && z <= d.end + CONFIG.denseEdgeBuffer);
    if (!inDense) {
      const choices = [0, 1, 2].filter(l => l !== lastLane);
      const lane = choices[Math.floor(rng() * choices.length)];
      foods.push({ z, lane });
      lastLane = lane;
    }
    z += CONFIG.sparseGapMin + rng() * (CONFIG.sparseGapMax - CONFIG.sparseGapMin);
  }

  // 密集区間: rowSpacing刻みの列。必ず1レーンを空け、残り2レーンに置く(= 常に逃げ道がある)。
  // 空きレーンは隣へしか動かさないので、追従すれば完全回避できる配置を保証している。
  for (const d of denseZones) {
    let openLane = Math.floor(rng() * 3);
    let sameCount = 0;
    for (let rowZ = d.start; rowZ <= d.end; rowZ += d.rowSpacing) {
      // 同じレーンが denseMaxSameLane 列続いたら強制的に動かす。
      // これを入れないと「1・2レーンだけに食べ物が続き、3レーンがずっとガラ空き」になる。
      const mustMove = sameCount >= CONFIG.denseMaxSameLane;
      if (mustMove || rng() < CONFIG.denseWeaveChance) {
        // 端では折り返す。以前は clamp していたため端で動かず、偏りの原因になっていた。
        let dir = rng() < 0.5 ? -1 : 1;
        if (openLane + dir < 0 || openLane + dir > 2) dir = -dir;
        openLane += dir;
        sameCount = 0;
      } else {
        sameCount++;
      }
      for (let lane = 0; lane < 3; lane++) {
        if (lane !== openLane) foods.push({ z: rowZ, lane });
      }
    }
    // 障害物キャラは密集区間の手前に配置
    women.push({ z: d.start - CONFIG.womanLeadDist, lane: Math.floor(rng() * 3) });
  }

  return { foods, women };
}

/* ================================================================
   Three.js セットアップ(全部プリミティブ)
   ================================================================ */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 60, 160);

const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 300);
const renderer = new THREE.WebGLRenderer({ antialias: true });

const womanMatBody = new THREE.MeshLambertMaterial({ color: 0xdd2255 });

let foodMeshes = [];  // {mesh, lane, z, eaten}
let womanMeshes = []; // {mesh, lane, z, hit, revealT}

const WOMAN_HIDE_Y = -3.2;   // 女性キャラの隠し位置(地面より下。ここから0まで上がってくる)
const MINI_GAUGE_SIDE = 2.4; // ミニ血糖バーを主人公の何units右に置くか(大きいほど体から離れる)

// カメラが+z方向を向くため画面上はx軸が左右反転して映る。ここで符号を反転させて
// 「右キー(lane+1)=画面の右」に合わせる(食べ物配置・当たり判定も全てこの関数を通る)
function laneToX(lane) { return (1 - lane) * CONFIG.laneWidth; }

function spawnCourse() {
  for (const f of foodMeshes) scene.remove(f.mesh);
  for (const w of womanMeshes) scene.remove(w.mesh);
  foodMeshes = [];
  womanMeshes = [];

  const layout = buildLayout();
  for (const f of layout.foods) {
    const mesh = new THREE.Mesh(foodGeo, foodMat.clone());
    mesh.position.set(laneToX(f.lane), 1.0, f.z);
    scene.add(mesh);
    foodMeshes.push({ mesh, lane: f.lane, z: f.z, eaten: false });
  }
  for (const w of layout.women) {
    const g = new THREE.Group();
    const body = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.7, 1.9, 12), womanMatBody.clone());
    body.position.y = 1.0;
    g.add(body);
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.45, 12, 10), new THREE.MeshLambertMaterial({ color: 0xf0c090 }));
    head.position.y = 2.35;
    g.add(head);
    // 地面の下に隠しておき、直前まで近づいたらせり上がる(revealT: 0=地中 1=完全に出た)
    g.position.set(laneToX(w.lane), WOMAN_HIDE_Y, w.z);
    scene.add(g);
    womanMeshes.push({ mesh: g, lane: w.lane, z: w.z, hit: false, revealT: 0 });
  }
}

const S = {};
function resetGame() {
  S.state = "running";
  S.glucose = 50;
  S.z = 0;
  S.lane = 1;            // 0=左 1=中 2=右
  S.x = 0;
  S.elapsed = 0;
  S.shotCooldown = 0;    // クールタイム 残り秒
  S.shotFlash = 0;       // 注射を撃った手応えの表示 残り秒
  S.lock = 0;            // 注射ロック 残り秒
  S.zoneGauge = 0;       // 0〜100
  S.zoneActive = 0;      // ゾーン 残り秒
  S.foodBoost = 0;       // 食べた瞬間ブースト 残り秒
  S.foodPop = 0;         // 食べた演出 残り秒
  S.zoneReady = false;   // ゾーン満タン(Zキー発動待ち)
  S.hyperTimer = 0;      // 高血糖カウントダウン 残り秒(0=非発動)
  S.shotCount = 0;
  S.clearedCount = 0;    // 注射で消した食べ物の総数
  S.lastCleared = 0;     // 直近1回で消した数
  S.zoneTotal = 0;
  S.robbedCount = 0;     // 奪われ(ロック)回数
  spawnCourse();
  hide(overOverlay); hide(goalOverlay);
}

const startOverlay = document.getElementById("startOverlay");
const overOverlay  = document.getElementById("overOverlay");
const goalOverlay  = document.getElementById("goalOverlay");
function hide(el) { el.classList.add("hidden"); }
function show(el) { el.classList.remove("hidden"); }

let started = false;
function startGame() {
  if (started) return;
  started = true;
  hide(startOverlay);
  resetGame();
}
startOverlay.addEventListener("click", startGame);

addEventListener("keydown", (e) => {
  if (!started) {
    if (e.key === "Enter") startGame();
    return;
  }
  if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") {
    if (S.state === "running") S.lane = Math.max(0, S.lane - 1);
  } else if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") {
    if (S.state === "running") S.lane = Math.min(2, S.lane + 1);
  } else if (e.key === " ") {
    e.preventDefault();
    tryShot();
  } else if (e.key === "z" || e.key === "Z") {
    if (S.state === "running" && S.zoneReady) {
      S.zoneReady = false;
      S.zoneGauge = 100;
      S.zoneActive = CONFIG.zoneDuration; // 貯めたゾーンを発動
    }
  } else if (e.key === "r" || e.key === "R") {
    resetGame();
  }
});

// 注射(マンジャロ)= 目の前の食べ物をまとめて消す。効果は一瞬で、持続しない。
// 「食べたいのに食べられない」ではなく「誘惑そのものが消える」形にした(薬の作用に近い)。
// 代償は血糖が上がらないこと=そのまま低血糖に近づくこと。
function tryShot() {
  if (S.state !== "running") return;
  if (S.lock > 0 || S.shotCooldown > 0) return; // 不発
  S.shotCooldown = CONFIG.shotCooldown;
  S.shotCount++;

  const range = CONFIG.baseSpeed * rampMult() * CONFIG.shotClearSec;
  let cleared = 0;
  for (const f of foodMeshes) {
    if (f.eaten || f.z < S.z || f.z - S.z > range) continue;
    f.eaten = true;
    f.mesh.visible = false;
    cleared++;
  }
  S.clearedCount += cleared;
  S.lastCleared = cleared;  // 直近1回で何個消えたか(パネルの表示用)
  S.shotFlash = 0.35;
}

/* ================================================================
   メインループ
   ================================================================ */
let lastT = performance.now();

function rampMult() {
  // 進行度に応じて 1.0 → rampEndMult まで加速し続ける(血糖値は速度に関与しない)
  const p = Math.max(0, Math.min(1, S.z / COURSE_LENGTH));
  return 1 + (CONFIG.rampEndMult - 1) * Math.pow(p, CONFIG.rampCurve);
}

function update(dt) {
  if (S.state !== "running") return;

  // 血糖の自然減少(ゾーン中は血糖が凍結される=無敵)。高血糖時は急降下、通常時はやや速め
  if (S.zoneActive <= 0) {
    const drain = S.glucose > CONFIG.stableMax ? CONFIG.drainPerSecHigh : CONFIG.drainPerSec;
    S.glucose -= drain * dt;
  }

  // タイマー類
  S.elapsed += dt;
  S.shotCooldown = Math.max(0, S.shotCooldown - dt);
  S.shotFlash = Math.max(0, S.shotFlash - dt);
  S.lock = Math.max(0, S.lock - dt);
  S.foodBoost = Math.max(0, S.foodBoost - dt);
  S.foodPop = Math.max(0, S.foodPop - dt);

  // ゾーンゲージ
  if (S.zoneActive > 0) {
    S.zoneActive = Math.max(0, S.zoneActive - dt);
    S.zoneTotal += dt;
    S.zoneGauge = (S.zoneActive / CONFIG.zoneDuration) * 100;
  } else if (!S.zoneReady) {
    // ゾーン蓄積は帯(zoneBand)滞在中のみ。満タンで「準備完了」になり、発動タイミングはプレイヤーがZキーで選ぶ
    const inZoneBand = S.glucose >= CONFIG.zoneBandMin && S.glucose <= CONFIG.zoneBandMax;
    if (inZoneBand) S.zoneGauge += CONFIG.zoneChargePerSec * dt;
    else S.zoneGauge -= CONFIG.zoneDecayPerSec * dt;
    S.zoneGauge = Math.min(100, Math.max(0, S.zoneGauge));
    if (S.zoneGauge >= 100) S.zoneReady = true; // 貯金完了。いつ切るかは自分で決める
  }

  // 移動:進行度で勝手に加速し続ける。ゾーン中はさらに倍率をかけて疾走(無敵タイム)
  const runSpeed = CONFIG.baseSpeed * rampMult();
  if (S.zoneActive > 0) {
    S.z += runSpeed * CONFIG.zoneSpeedMult * dt;
  } else {
    const boostMult = S.foodBoost > 0 ? CONFIG.foodBoostMult : 1;
    S.z += runSpeed * boostMult * dt;
  }

  // 女性キャラのせり上がり:一定の「時間」手前まで近づいたら地面から出てくる。
  // 出現距離を固定にすると、速度50の序盤と速度120の終盤で反応時間が2倍以上変わって
  // 終盤が運ゲーになるため、距離ではなく時間(走行速度×womanRevealSec)で持つ。
  const revealDist = runSpeed * CONFIG.womanRevealSec;
  for (const w of womanMeshes) {
    if (w.revealT >= 1) continue;
    if (w.z - S.z <= revealDist) w.revealT = Math.min(1, w.revealT + dt / CONFIG.womanRiseSec);
  }

  // レーン移動(スムーズに)
  const targetX = laneToX(S.lane);
  const dx = targetX - S.x;
  const step = CONFIG.laneChangeSpeed * dt;
  S.x += Math.abs(dx) <= step ? dx : Math.sign(dx) * step;

  // 食べ物との当たり判定(ゾーン中は無効=すり抜けて突っ走る)
  for (const f of foodMeshes) {
    if (f.eaten || S.zoneActive > 0) continue;
    if (Math.abs(f.z - S.z) < CONFIG.collectDist && Math.abs(laneToX(f.lane) - S.x) < CONFIG.laneWidth * 0.45) {
      f.eaten = true;
      f.mesh.visible = false;
      S.glucose += CONFIG.foodGain;
      S.foodBoost = CONFIG.foodBoostDuration; // 食べた瞬間ブースト(重ねず上書きリフレッシュ)
      S.foodPop = FOOD_POP_SEC;               // 「+20」の飛び出しと画面フチの発光をリセット
    }
  }

  // 障害物キャラとの当たり判定 → 注射ロック(ゾーン中は無敵ですり抜け)
  for (const w of womanMeshes) {
    if (w.hit || S.zoneActive > 0) continue;
    if (Math.abs(w.z - S.z) < CONFIG.collectDist && Math.abs(laneToX(w.lane) - S.x) < CONFIG.laneWidth * 0.45) {
      // 奪われるのは「次の1本」だけ。すでに撃った注射の効果(消えた食べ物)は取り消されない
      w.hit = true;
      S.lock = CONFIG.lockDuration;
      S.robbedCount++;
      w.mesh.children.forEach(c => { if (c.material) c.material.color.set(0x884466); });
    }
  }

  // 高血糖カウントダウン(80超で発動、猶予内に hyperResetBelow まで下げないと死)
  // ゾーン中は血糖が凍結されているのでカウントダウンも停止(無敵)
  S.glucose = Math.min(100, S.glucose); // 上限は100でクランプ(即死はしない。死はカウントダウンで裁く)
  if (S.zoneActive > 0) {
    // 凍結中: カウントダウンを進めない
  } else if (S.hyperTimer > 0) {
    if (S.glucose <= CONFIG.hyperResetBelow) {
      S.hyperTimer = 0; // 戻せた→解除
    } else {
      S.hyperTimer -= dt;
      if (S.hyperTimer <= 0)
        return gameOver("高血糖", `血糖値を ${CONFIG.hyperGraceSec} 秒以内に下げられなかった(食べるのを止める/注射で上昇を抑える)`);
    }
  } else if (S.glucose > CONFIG.hyperThreshold) {
    S.hyperTimer = CONFIG.hyperGraceSec; // カウントダウン開始
  }

  // 勝敗判定
  if (S.glucose <= 0) return gameOver("低血糖", "血糖値が 0 になった(食べなさすぎ / 注射効果中に補給できなかった)");
  if (S.z >= COURSE_LENGTH) return goal();
}

function gameOver(type, reason) {
  S.state = "over";
  document.getElementById("overTitle").textContent = type + "で倒れた!";
  document.getElementById("overReason").textContent = reason;
  show(overOverlay);
}

/* ---- ハイスコア(localStorage) ----
   注意: file:// で直接開いた場合と Pages の URL では保存先が別扱いになる。
   チームでタイムを比べるなら全員が同じ URL で遊ぶこと。 */
// キーにコース長を含める。コース長を変えると記録が別枠になるので、
// 旧コースの短いタイムが「二度と更新できないベスト」として残り続けるのを防げる。
const HS_KEY = "manjaro_proto_best_" + Math.round(COURSE_LENGTH);

function loadBest() {
  try {
    const v = parseFloat(localStorage.getItem(HS_KEY));
    return isFinite(v) && v > 0 ? v : null;
  } catch (e) { return null; } // プライベートモード等で localStorage が使えなくても落とさない
}
function saveBest(sec) {
  try { localStorage.setItem(HS_KEY, sec.toFixed(2)); } catch (e) {}
}

function goal() {
  S.state = "goal";
  const time = S.elapsed;
  const prev = loadBest();
  const isNew = prev === null || time < prev;
  if (isNew) saveBest(time);

  document.getElementById("goalTime").textContent = time.toFixed(2) + " 秒";

  const newRecordEl = document.getElementById("goalNewRecord");
  const bestEl = document.getElementById("goalBest");
  if (isNew) {
    newRecordEl.classList.remove("hidden");
    bestEl.textContent = prev === null
      ? "初記録!"
      : `これまでのベスト ${prev.toFixed(2)} 秒 → ${(prev - time).toFixed(2)} 秒 短縮`;
  } else {
    newRecordEl.classList.add("hidden");
    bestEl.textContent = `ベスト ${prev.toFixed(2)} 秒(あと ${(time - prev).toFixed(2)} 秒)`;
  }

  document.getElementById("goalStats").textContent =
    `注射 ${S.shotCount} 回(食べ物 ${S.clearedCount} 個を消去) / 奪われ ${S.robbedCount} 回 / ゾーン合計 ${S.zoneTotal.toFixed(1)} 秒`;
  show(goalOverlay);
}

function updateHUD() {
  const g = Math.max(0, Math.min(100, S.glucose));
  glucoseNeedle.style.left = `calc(${g}% - 2px)`;
  glucoseNum.textContent = Math.round(g);
  const pct = Math.round(rampMult()
    * (S.zoneActive > 0 ? CONFIG.zoneSpeedMult : (S.foodBoost > 0 ? CONFIG.foodBoostMult : 1)) * 100);
  speedNum.textContent = `速度 ${pct}%`
    + (S.zoneActive > 0 ? " 🌟ゾーン!!" : (S.foodBoost > 0 ? " ⚡⚡ 加速!!" : ""));

  // 食べた瞬間、血糖の数字を跳ねさせる(数字がどこで動いたのか気付かせる)
  const popT = S.foodPop / FOOD_POP_SEC;   // 1 → 0
  glucoseNum.style.transform = popT > 0 ? `scale(${1 + popT * 0.7})` : "";
  glucoseNum.style.color = popT > 0 ? "#ffb02e" : "";
  foodVignette.style.opacity = popT > 0 ? (popT * 0.9) : 0;

  zoneBar.style.width = S.zoneGauge + "%";
  if (S.zoneActive > 0) {
    zonePanel.classList.add("active");
    zoneLabel.textContent = `ゾーン発動中! 残り ${S.zoneActive.toFixed(1)} 秒`;
  } else if (S.zoneReady) {
    zonePanel.classList.add("active");
    zoneLabel.textContent = "ゾーン準備完了! Zキーで発動!!";
  } else {
    zonePanel.classList.remove("active");
    zoneLabel.textContent = `ゾーンゲージ(緑=${CONFIG.zoneBandMin}〜${CONFIG.zoneBandMax}キープで蓄積)`;
  }

  timePanel.textContent = S.state === "running" ? S.elapsed.toFixed(2) : timePanel.textContent;

  // ゲージは常に「満タン = 使える」で統一する(奪われ中も補充中も、溜まりきったら撃てる)
  shotPanel.className = "";
  // 撃った直後に女性に当たった場合は「奪われた」を優先する(緊急度が高いため)。
  // 画面フチの水色フラッシュは firing に紐づくので、消去の手応え自体は残る。
  const firing = S.shotFlash > 0;
  if (S.lock > 0) {
    shotPanel.classList.add("locked");
    shotState.textContent = `奪われた!\n取り返すまで ${S.lock.toFixed(1)} 秒`;
    shotBar.style.width = ((1 - S.lock / CONFIG.lockDuration) * 100) + "%";
  } else if (firing) {
    shotPanel.classList.add("firing");
    shotState.textContent = S.lastCleared > 0
      ? `食べ物 ${S.lastCleared} 個を消した!`
      : "前方に食べ物なし";
    shotBar.style.width = "100%";
  } else if (S.shotCooldown > 0) {
    shotPanel.classList.add("cooldown");
    shotState.textContent = `補充中\nあと ${S.shotCooldown.toFixed(1)} 秒`;
    shotBar.style.width = ((1 - S.shotCooldown / CONFIG.shotCooldown) * 100) + "%";
  } else {
    shotPanel.classList.add("ready");
    shotState.textContent = "スペースで注射\n前方の食べ物を消す";
    shotBar.style.width = "100%";
  }
  shotVignette.className = firing ? "on" : "";

  dangerVignette.className = (S.state === "running" && (g < CONFIG.dangerZone || S.hyperTimer > 0)) ? "on" : "";

  if (S.state === "running" && S.hyperTimer > 0) {
    hyperWarn.classList.remove("hidden");
    hyperWarn.textContent = `⚠ 高血糖! あと ${S.hyperTimer.toFixed(1)} 秒で ${CONFIG.hyperResetBelow} 以下に戻せ!`;
  } else {
    hyperWarn.classList.add("hidden");
  }
  zoneVignette.className = S.zoneActive > 0 ? "on" : "";
}

function render() {
  player.position.set(S.x, 0, S.z);
  // 走りの上下ゆれ
  player.position.y = Math.abs(Math.sin(S.elapsed * 12)) * 0.15;

  // 食べた瞬間、主人公を一瞬ふくらませる(取れたことを自機の動きでも伝える)
  const popT = S.foodPop / FOOD_POP_SEC;
  if (popT > 0) player.scale.set(1 + popT * 0.35, 1 + popT * 0.2, 1 + popT * 0.35);
  else player.scale.set(1, 1, 1);

  // カメラは真後ろ固定
  camera.position.set(S.x, 5, S.z - 11);
  camera.lookAt(S.x, 1.5, S.z + 12);

  // 速度が上がるほど遠くまで見えるようにフォグを引き伸ばす(高速でも反応時間を確保)
  const vm = rampMult();
  scene.fog.near = 60 * vm;
  scene.fog.far = 160 * vm;

  // 速度に応じてFOVを広げてスピード感を演出(60°→最大約78°。ゾーン中はさらに広く)
  const targetFov = 60 + (vm - 1) * 10 + (S.zoneActive > 0 ? 12 : 0);
  camera.fov += (targetFov - camera.fov) * 0.1; // なめらかに追従
  camera.updateProjectionMatrix();

  // 横のミニ血糖バー:主人公の右隣のワールド座標をスクリーン座標に投影して追従させる。
  // laneToX が符号を反転しているとおり、画面の右はワールドの -x 側。
  if (S.state === "running") {
    miniGauge.classList.remove("hidden");
    const sidePos = new THREE.Vector3(S.x - MINI_GAUGE_SIDE, 1.6, S.z);
    sidePos.project(camera);
    miniGauge.style.left = ((sidePos.x * 0.5 + 0.5) * innerWidth) + "px";
    miniGauge.style.top = ((-sidePos.y * 0.5 + 0.5) * innerHeight) + "px";
    const g = Math.max(0, Math.min(100, S.glucose));
    miniNeedle.style.bottom = `calc(${g}% - 2px)`;
    miniGauge.classList.toggle("danger", S.hyperTimer > 0 || g < CONFIG.dangerZone);
  } else {
    miniGauge.classList.add("hidden");
  }

  // 「+20」を主人公の上に飛び出させる(残り時間に応じて上へ動かしながら消す)
  if (S.state === "running" && popT > 0) {
    foodPopup.classList.remove("hidden");
    foodPopup.textContent = "+" + CONFIG.foodGain;
    const rise = (1 - popT) * 1.8;   // 時間が経つほど上へ
    const p = new THREE.Vector3(S.x, 3.6 + rise, S.z).project(camera);
    foodPopup.style.left = ((p.x * 0.5 + 0.5) * innerWidth) + "px";
    foodPopup.style.top = ((-p.y * 0.5 + 0.5) * innerHeight) + "px";
    foodPopup.style.opacity = Math.min(1, popT * 2);   // 最後だけフェードアウト
  } else {
    foodPopup.classList.add("hidden");
  }

  // 食べ物をぷかぷか回す
  for (const f of foodMeshes) {
    if (!f.eaten) f.mesh.rotation.y += 0.02;
  }

  // 女性キャラを地面から突き上げる(最後に減速するイージングで「ズドン」と出る感じにする)
  for (const w of womanMeshes) {
    const e = 1 - Math.pow(1 - w.revealT, 3);
    w.mesh.position.y = WOMAN_HIDE_Y * (1 - e);
  }
  renderer.render(scene, camera);
}

function loop(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000); // タブ切替等の巨大dtを防ぐ
  lastT = now;
  if (started) {
    update(dt);
    updateHUD();
    render();
  }
  requestAnimationFrame(loop);
}

// 開始前も背景だけ描画しておく
S.state = "ready"; S.x = 0; S.z = 0; S.glucose = 50; S.elapsed = 0;
S.zoneGauge = 0; S.zoneActive = 0; S.shotFlash = 0; S.shotCooldown = 0; S.lock = 0;
S.foodBoost = 0; S.foodPop = 0; S.robbedCount = 0; S.shotCount = 0; S.clearedCount = 0; S.lastCleared = 0;
S.zoneTotal = 0; S.hyperTimer = 0; S.zoneReady = false;
spawnCourse();
render();
requestAnimationFrame(loop);
</script>
</body>
</html>
